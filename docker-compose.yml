services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autoservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports: ["5432:5432"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      USE_SQLITE: "False"
      DB_NAME: autoservice
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: "5432"
    ports: ["8000:8000"]
    depends_on: [db]
volumes:
  postgres_data:
